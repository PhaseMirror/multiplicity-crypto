[package]
name = "multiplicity-crypto-rust"
version = "1.0.0"
edition = "2021"
description = "Keccak256 Fiat-Shamir transcript; BN254 Pedersen dependencies present but WASM not built"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
sha3 = "0.10"
ark-ff = "0.4.0"
ark-ec = "0.4.0"
ark-bn254 = "0.4.0"
ark-std = "0.4.0"
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"
hex = "0.4"

[workspace]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
